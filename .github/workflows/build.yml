name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        shell: bash
        run: |
          msg=$(grep -vE "^> Task" build.log | grep -E "^e: |What went wrong|error:|ERROR" -A4 | head -50 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error::$msg"
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk yama-app.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: やまナビ v0.1.${{ github.run_number }}
          body: 下の yama-app.apk をタップしてダウンロード → インストール
          files: yama-app.apk
          make_latest: true
